<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Influential Brands — Knowledge Wiki</title>
<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#f7f9fc; --border:#e2e7f0; --text:#141a24; --muted:#697386;
    --accent:#1a56db; --accent-rgb:26,86,219; --accent-soft:#e8effc; --row-hover:#f3f6fc; --row-active:#e8effc;
    --chip:#f1f4f9; --shadow:0 1px 3px rgba(20,26,36,.06),0 8px 24px rgba(20,26,36,.05);
    --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.34); --glass-border:rgba(255,255,255,.7);
    --glow1:rgba(123,63,242,.14); --glow2:rgba(26,86,219,.13);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f141b; --panel:#161d27; --panel2:#12181f; --border:#26303d; --text:#e7ecf3; --muted:#93a0b2;
      --accent:#5b8cff; --accent-rgb:91,140,255; --accent-soft:#1b2a44; --row-hover:#1b2430; --row-active:#22314a;
      --chip:#1d2632; --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
      --glass:rgba(26,34,46,.58); --glass-2:rgba(18,24,32,.42); --glass-border:rgba(255,255,255,.09);
      --glow1:rgba(123,63,242,.20); --glow2:rgba(91,140,255,.18);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);font-size:14px;line-height:1.5;
    background:
      radial-gradient(1100px 620px at -5% -5%, var(--glow1), transparent 60%),
      radial-gradient(1000px 560px at 105% 108%, var(--glow2), transparent 58%),
      var(--bg);}
  .app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:13px 20px;flex-shrink:0;
    background:linear-gradient(180deg,var(--glass),var(--glass-2));
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    border-bottom:1px solid var(--glass-border)}
  header .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7b3ff2);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{font-size:12px;color:var(--muted)}
  header .spacer{flex:1}
  .navbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .navbtn:hover:not(:disabled){background:var(--row-hover)}
  .navbtn:disabled{opacity:.35;cursor:default}
  .body{display:flex;flex:1;min-height:0}
  /* Sidebar — frosted glass */
  .sidebar{width:206px;flex-shrink:0;overflow-y:auto;padding:10px 9px;
    background:linear-gradient(180deg,var(--glass),var(--glass-2));
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    border-right:1px solid var(--glass-border)}
  .side-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-weight:700;padding:8px 12px 8px}
  .tnav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;
    user-select:none;border:1px solid transparent;margin-bottom:2px;transition:background .14s,border-color .14s,transform .06s}
  .tnav:hover{background:rgba(var(--accent-rgb),.08)}
  .tnav:active{transform:scale(.985)}
  .tnav.active{background:linear-gradient(90deg,rgba(var(--accent-rgb),.20),rgba(var(--accent-rgb),.07));
    border-color:rgba(var(--accent-rgb),.38);color:var(--accent);font-weight:650;
    box-shadow:0 3px 12px rgba(var(--accent-rgb),.16)}
  .tnav .ic{width:20px;text-align:center;font-size:16px;line-height:1;flex-shrink:0}
  .tnav .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .tnav .ct{font-size:11px;color:var(--muted);background:rgba(var(--accent-rgb),.09);padding:1px 8px;border-radius:20px;font-weight:600}
  .tnav.active .ct{color:var(--accent);background:rgba(var(--accent-rgb),.16)}
  /* List */
  .list-col{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
  .search{padding:11px 13px;border-bottom:1px solid var(--border);position:relative}
  .search input{width:100%;padding:9px 12px 9px 33px;border:1px solid var(--border);border-radius:9px;
    background:var(--bg);color:var(--text);font:inherit;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:25px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
  .list{overflow-y:auto;flex:1}
  .item{display:flex;align-items:center;gap:10px;padding:8px 15px;cursor:pointer;border-bottom:1px solid var(--border)}
  .item:hover{background:var(--row-hover)}
  .item.active{background:var(--row-active)}
  .item.active .nm{color:var(--accent)}
  .avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:650;color:#fff;background:#8896ab}
  .avatar.round{border-radius:50%}
  .item .txt{min-width:0;flex:1}
  .item .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nomatch{padding:40px 20px;text-align:center;color:var(--muted)}
  /* Detail */
  .detail-col{flex:1;overflow-y:auto;padding:28px 36px}
  .empty-detail{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:8px}
  .empty-detail .big{font-size:40px;opacity:.5}
  .card{max-width:760px;margin:0 auto}
  .card-head{display:flex;align-items:center;gap:15px;margin-bottom:22px}
  .card-head .avatar{width:56px;height:56px;font-size:20px;border-radius:12px}
  .card-head .avatar.round{border-radius:50%}
  .kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .card-head h2{margin:2px 0 0;font-size:22px;font-weight:680;letter-spacing:-.02em;line-height:1.2}
  .card-head .role{color:var(--muted);margin-top:2px;font-size:13px}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;margin:24px 0 11px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .field{background:var(--panel);padding:12px 15px}
  .field .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .field .v{font-weight:550;word-break:break-word}
  .field .v a{color:var(--accent);text-decoration:none}
  .field .v a:hover{text-decoration:underline}
  .te{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .te input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
  .te input:disabled{cursor:not-allowed;opacity:.6}
  .prof-hist{border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .ph-item{background:var(--panel);padding:11px 15px;border-top:1px solid var(--border)}
  .ph-item:first-child{border-top:none}
  .ph-title{font-weight:600}
  .ph-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
  .badge.active{background:#dcfce7;color:#166534}
  @media (prefers-color-scheme:dark){.badge.active{background:#0f2e1c;color:#4ade80}}
  .rel-group{margin-bottom:16px}
  .rel-head{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .rel-head .cnt{font-size:11px;background:var(--chip);padding:1px 8px;border-radius:20px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .link-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;background:var(--panel);
    border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;max-width:340px}
  .link-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .link-chip .ci{flex-shrink:0}
  .link-chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
  a.contact{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;background:var(--accent);
    color:#fff;text-decoration:none;font-weight:550;font-size:13px}
  a.contact.ghost{background:var(--chip);color:var(--text)}
  a.contact:hover{opacity:.9}
  .morebtn{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;padding:4px 2px;font-weight:600}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{padding:2px 9px;border-radius:6px;background:var(--chip);font-size:12px;color:var(--muted)}
  /* Ask / chat */
  .tnav.ask{background:linear-gradient(90deg,rgba(123,63,242,.18),rgba(var(--accent-rgb),.09));
    border:1px solid rgba(var(--accent-rgb),.32);font-weight:650;margin-bottom:10px}
  .tnav.ask.active{box-shadow:0 3px 14px rgba(var(--accent-rgb),.22)}
  .detail-col.ask-mode{padding:0;display:flex}
  .ask-wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:880px;margin:0 auto}
  .ask-top{padding:18px 26px 8px}
  .ask-top h2{margin:0;font-size:18px;font-weight:680}
  .ask-top p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .chat{flex:1;overflow-y:auto;padding:14px 26px;display:flex;flex-direction:column;gap:13px}
  .msg{max-width:90%;font-size:14px;line-height:1.55}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;padding:9px 14px;border-radius:15px 15px 4px 15px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);padding:13px 17px;
    border-radius:15px 15px 15px 4px;box-shadow:var(--shadow);width:100%}
  .msg.bot p{margin:8px 0}.msg.bot p:first-child{margin-top:0}.msg.bot b,.msg.bot strong{font-weight:650}
  .msg.bot h4,.msg.bot h5,.msg.bot h6{font-size:13.5px;font-weight:650;margin:11px 0 4px}.msg.bot h4:first-child,.msg.bot h5:first-child,.msg.bot h6:first-child{margin-top:0}
  .msg.bot ul,.msg.bot ol{margin:6px 0;padding-left:20px}.msg.bot li{margin:3px 0}
  .msg.bot code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .suggests{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
  .suggest{font-size:12.5px;padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--panel);cursor:pointer;color:var(--text)}
  .suggest:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .ans-sec{margin:12px 0 4px}
  .ans-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
  .ans-line{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
  .ans-role{color:var(--muted);font-size:13px}
  .ans-date{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);min-width:84px}
  .ans-more{color:var(--muted);font-size:12px;align-self:center}
  .ans-note{margin-top:11px;font-size:13px;color:var(--muted);background:var(--chip);padding:10px 13px;border-radius:10px}
  .ask-input{display:flex;gap:9px;padding:13px 26px 18px;border-top:1px solid var(--border);
    background:linear-gradient(180deg,transparent,var(--panel2))}
  .ask-input input{flex:1;padding:11px 15px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;outline:none}
  .ask-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ask-input button{padding:0 20px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}
  .ask-input button:hover{opacity:.92}
  @media (max-width:820px){.sidebar{width:200px}.list-col{width:250px}.detail-col{padding:20px}.grid{grid-template-columns:1fr}}
  @media (max-width:560px){.tnav .ct{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">IB</div>
    <div>
      <h1>Influential Brands — Knowledge Wiki</h1>
      <div class="sub" id="subhead">Relationship, campaign & communications vault</div>
    </div>
    <div class="spacer"></div>
    <button class="navbtn" id="refreshBtn" title="Refresh — rebuild from the vault and reload" style="display:none">↻</button>
    <button class="navbtn" id="backBtn" title="Back">‹</button>
    <button class="navbtn" id="fwdBtn" title="Forward">›</button>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="list-col">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="detail-col">
      <div id="detail">
        <div class="empty-detail"><div class="big">📚</div><div>Select an entity to view its record</div></div>
      </div>
    </div>
  </div>
</div>
<script src="wiki-data.js"></script>
<script>
const DATA = window.DATA || {types:[],nodes:{}};
if(!window.DATA){try{document.getElementById('detail').innerHTML='<div class="empty-detail"><div class="big">📄</div><div>Data file <code>wiki-data.js</code> not found.<br>Keep it in the same folder as this HTML file.</div></div>';}catch(e){}}
const NODES = DATA.nodes;
const TYPES = DATA.types;
const TYPE_META = {}; TYPES.forEach(t=>TYPE_META[t.key]=t);

// Reverse index: targetId -> [[rel, sourceId], ...]
const INBOUND = {};
for(const id in NODES){
  for(const [rel,tid] of NODES[id].l){
    (INBOUND[tid] = INBOUND[tid] || []).push([rel, id]);
  }
}

const el = id=>document.getElementById(id);
const listEl=el('list'), detailEl=el('detail'), qEl=el('q'), sidebarEl=el('sidebar');
const PALETTE=['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444','#6366f1','#14b8a6','#f97316'];
function colorFor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(name){const p=String(name).replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).filter(Boolean);
  return p.length?(p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase():'?';}
function icon(t){return (TYPE_META[t]&&TYPE_META[t].icon)||'•';}
function isPerson(t){return t==='people';}
// --- Enrichment (provider-neutral): show the provider + date, not Clay-only framing ---
function fmtDateStr(iso){if(!iso)return '';const d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function enrichmentInfo(f){
  if(!f)return null;
  const date=f.enrichedAt||f.enrichmentDate||f.clayEnhanced||null;
  if(!date)return null;
  let provider=f.enrichedBy||f.enrichmentProvider||null;
  if(!provider&&f.clayEnhanced)provider='Clay';
  return {date,provider};
}
function prettyProvider(p){if(!p)return '';const m={clay:'Clay',linkedin:'LinkedIn'};const k=String(p).toLowerCase();return m[k]||(p[0].toUpperCase()+p.slice(1));}
// Enrichment was attempted but nothing useful landed — read a vault status field
// (whatever the enrichment runner writes). Absent today, so this is inert until then.
function enrichmentFailed(f){
  if(!f)return false;
  const s=f.enrichmentStatus!=null?String(f.enrichmentStatus).toLowerCase():(f.enrichmentFound===false?'not_found':'');
  return ['failed','fail','no_match','no-match','not_found','not-found','none','empty','no_enrichment','no-enrichment','nothing_found'].includes(s);
}
function enrichmentDisplay(f){
  if(enrichmentFailed(f))return 'No enrichment found';
  const e=enrichmentInfo(f);
  if(!e)return '—';
  const d=fmtDateStr(e.date);
  return e.provider?`${esc(d)} · ${esc(prettyProvider(e.provider))}`:esc(d);
}
function fmtMonth(ym){if(!ym)return '';const m=/^(\d{4})-(\d{2})/.exec(String(ym));if(!m)return String(ym);return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+m[1];}
// Enriched profile: show the contact + role fields enrichment wrote, for enriched people
function enrichedProfileBlock(n){
  if(!isPerson(n.t)||enrichmentFailed(n.f)||!enrichmentInfo(n.f))return '';
  const f=n.f, rows=[];
  const jt=f.jobTitle||f.currentRole; if(jt)rows.push(['Job title',esc(jt)]);
  const co=f.company||f.organisation; if(co)rows.push(['Company',esc(co)]);
  if(f.location)rows.push(['Location',esc(f.location)]);
  const ph=f.phone||f.mobilePhone; if(ph)rows.push(['Phone',esc(ph)]);
  if(f.primaryEmail)rows.push(['Email',`<a href="mailto:${esc(f.primaryEmail)}">${esc(f.primaryEmail)}</a>`]);
  if(f.linkedInUrl)rows.push(['LinkedIn',`<a href="${esc(f.linkedInUrl)}" target="_blank" rel="noopener">${esc(f.linkedInUrl.replace(/^https?:\/\/(www\.)?/,''))}</a>`]);
  const grid=rows.length?'<div class="grid">'+rows.map(([k,v])=>`<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')+'</div>':'';
  let hist='';
  if(Array.isArray(n.ph)&&n.ph.length){
    hist='<div class="prof-hist">'+n.ph.map(r=>{
      const span=[fmtMonth(r.start),r.end?fmtMonth(r.end):'Present'].filter(Boolean).join(' – ');
      const sub=[esc(r.company||''),span].filter(Boolean).join(' · ');
      return `<div class="ph-item"><div class="ph-title">${esc(r.title||'')}</div>${sub?`<div class="ph-sub">${sub}</div>`:''}</div>`;
    }).join('')+'</div>';
  }
  if(!grid&&!hist)return '';
  return `<div class="section-label">Enriched profile</div>${grid}`+
    (hist?`<div class="section-label" style="margin-top:14px">Professional history</div>${hist}`:'');
}
// --- Editable "To Enhance" checkbox (persists to the vault via the local server) ---
const CAN_EDIT = location.protocol==='http:'||location.protocol==='https:';
// Refresh: ask the local server to rebuild wiki data from the vault, then reload
async function doRefresh(btn){
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';
  try{
    const r=await fetch('/rebuild',{method:'POST'});
    const j=await r.json();
    if(j.status!=='ok') throw new Error(j.error||'rebuild failed');
    location.reload();
  }catch(e){
    btn.disabled=false; btn.textContent=old;
    alert('Refresh failed: '+e.message+'\nMake sure you opened this via “Ask the Wiki.command”.');
  }
}
(function(){const rb=document.getElementById('refreshBtn'); if(rb&&CAN_EDIT){rb.style.display=''; rb.onclick=()=>doRefresh(rb);}})();
function toEnhanceControl(id,v){
  const checked=v===true?' checked':'';
  const dis=CAN_EDIT?'':' disabled';
  const hint=CAN_EDIT?' title="Tick to flag this person for enhancement"':' title="Open via ‘Ask the Wiki.command’ to tick this"';
  return `<label class="te"${hint}><input type="checkbox"${checked}${dis} data-teid="${esc(id)}" onchange="toggleToEnhance(this)"></label>`;
}
async function toggleToEnhance(cb){
  const id=cb.getAttribute('data-teid'),value=cb.checked;
  cb.disabled=true;
  try{
    const r=await fetch('/set-to-enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,value})});
    const j=await r.json();
    if(j.status!=='ok')throw new Error(j.error||'save failed');
    if(NODES[id]&&NODES[id].f)NODES[id].f.ToEnhance=value;
  }catch(e){
    cb.checked=!value;
    alert('Could not save “To Enhance”: '+e.message+'\nMake sure you opened this via “Ask the Wiki.command”.');
  }finally{cb.disabled=false;}
}
function fmtVal(k,v){
  if(v==null||v==='')return '—';
  if(typeof v==='boolean')return v?'Yes':'No';
  if(k==='confidence'&&typeof v==='number')return (v*100).toFixed(0)+'%';
  if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}(T|$)/.test(v)){const d=new Date(v);if(!isNaN(d))return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
  if(typeof v==='string'&&/^https?:\/\//.test(v))return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/,''))}</a>`;
  if(typeof v==='string'&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
  return esc(v);
}
const FIELD_LABELS={primaryEmail:'Email',linkedInUrl:'LinkedIn',mentionCount:'Mentions',displayName:'Name',
  ToEnhance:'To Enhance',
  createdAt:'Created',updatedAt:'Updated',startDate:'Start',endDate:'End',sentAt:'Sent',receivedAt:'Received',
  locationType:'Location type',memberCount:'Members',reuseCount:'Reuse count',fileSize:'File size',
  mimeType:'MIME type',sourceType:'Source type',eventType:'Event type',originalFilename:'File',
  securityClassification:'Classification',importedAt:'Imported',threadTopic:'Thread'};
function labelFor(k){return FIELD_LABELS[k]||(k[0].toUpperCase()+k.slice(1).replace(/([A-Z])/g,' $1'));}

let curType=null, curId=null, histBack=[], histFwd=[], mode='browse';
const convo=[];

function renderSidebar(){
  sidebarEl.innerHTML='';
  const ask=document.createElement('div');
  ask.className='tnav ask'+(mode==='ask'?' active':'');
  ask.title='Ask me something — a natural-language question about the vault';
  ask.innerHTML='<span class="ic">💬</span><span class="lb">Ask me something</span>';
  ask.onclick=()=>enterAsk();
  sidebarEl.appendChild(ask);
  const lbl=document.createElement('div'); lbl.className='side-label'; lbl.textContent='Entities';
  sidebarEl.appendChild(lbl);
  for(const t of TYPES){
    const row=document.createElement('div');
    row.className='tnav'+(mode!=='ask'&&t.key===curType?' active':'');
    row.title=(t.tip?t.tip+' · ':'')+t.count+' record'+(t.count===1?'':'s');
    row.innerHTML=`<span class="ic">${t.icon}</span><span class="lb">${esc(t.label)}</span><span class="ct">${t.count}</span>`;
    row.onclick=()=>{selectType(t.key);};
    sidebarEl.appendChild(row);
  }
}

function nodesOfType(t){
  const arr=[];
  for(const id in NODES){if(NODES[id].t===t)arr.push([id,NODES[id]]);}
  arr.sort((a,b)=>(a[1].n||'￿').toLowerCase().localeCompare((b[1].n||'￿').toLowerCase()));
  return arr;
}

function subtitleFor(id,n){
  // best-effort subtitle: first outbound org/company or key field
  if(n.f.primaryEmail)return n.f.primaryEmail;
  const org=n.l.find(([r])=>r==='Organisation');
  if(org&&NODES[org[1]])return NODES[org[1]].n;
  if(n.f.name&&n.f.name!==n.n)return n.f.name;
  const dt=n.f.sentAt||n.f.startDate||n.f.updatedAt;
  return dt?String(dt).slice(0,10):'';
}

function renderList(){
  const q=qEl.value.trim().toLowerCase();
  const terms=q?q.split(/\s+/):null;
  let items=nodesOfType(curType);
  if(terms){
    items=items.filter(([id,n])=>{
      const hay=(n.n+' '+Object.values(n.f).join(' ')+' '+(n.al||[]).join(' ')).toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  }
  const tm=TYPE_META[curType];
  qEl.placeholder='Search '+(tm?tm.label.toLowerCase():'')+'…';
  if(!items.length){listEl.innerHTML='<div class="nomatch">No matches</div>';return;}
  const frag=document.createDocumentFragment();
  const cap=Math.min(items.length,3000);
  for(let i=0;i<cap;i++){
    const [id,n]=items[i];
    const row=document.createElement('div');
    row.className='item'+(id===curId?' active':'');
    row.dataset.id=id;
    const sub=subtitleFor(id,n);
    row.innerHTML=`<div class="avatar${isPerson(n.t)?' round':''}" style="background:${colorFor(n.n)}">${isPerson(n.t)?esc(initials(n.n)):icon(n.t)}</div>`+
      `<div class="txt"><div class="nm">${esc(n.n)}</div><div class="sc">${esc(sub)}</div></div>`;
    row.onclick=()=>openEntity(id);
    frag.appendChild(row);
  }
  listEl.innerHTML='';listEl.appendChild(frag);
  if(items.length>cap){const d=document.createElement('div');d.className='nomatch';d.textContent=`+${items.length-cap} more — refine your search`;listEl.appendChild(d);}
}

function selectType(t,keepDetail){
  exitAsk();
  curType=t;
  qEl.value='';
  renderSidebar();
  renderList();
  if(!keepDetail){/* leave detail as-is */}
}

function linkChip(id){
  const n=NODES[id];if(!n)return '';
  return `<span class="link-chip" data-go="${esc(id)}"><span class="ci">${isPerson(n.t)?'👤':icon(n.t)}</span><span class="cn">${esc(n.n)}</span></span>`;
}

function relGroup(title,ids,startOpen){
  if(!ids.length)return '';
  const gid='g'+Math.random().toString(36).slice(2,8);
  const cap=startOpen?ids.length:Math.min(ids.length,24);
  const chips=ids.slice(0,cap).map(linkChip).join('');
  const more=ids.length>cap?`<button class="morebtn" data-more="${gid}">+${ids.length-cap} more</button>`:'';
  return `<div class="rel-group"><div class="rel-head">${esc(title)}<span class="cnt">${ids.length}</span></div>`+
    `<div class="chips" id="${gid}" data-all='${esc(JSON.stringify(ids))}'>${chips}</div>${more}</div>`;
}

function renderDetail(id){
  const n=NODES[id];if(!n)return;
  const tm=TYPE_META[n.t];
  // contact chips
  const contacts=[];
  if(n.f.primaryEmail)contacts.push(`<a class="contact" href="mailto:${esc(n.f.primaryEmail)}">✉︎ ${esc(n.f.primaryEmail)}</a>`);
  if(n.f.linkedInUrl)contacts.push(`<a class="contact ghost" href="${esc(n.f.linkedInUrl)}" target="_blank" rel="noopener">in · LinkedIn</a>`);

  // fields grid — enrichment fields are shown provider-neutrally below, not raw
  const skip=new Set(['linkedInUrl','primaryEmail','displayName','name','title','subject','query',
    'clayEnhanced','enrichedAt','enrichedBy','enrichmentProvider','enrichmentDate',
    'jobTitle','currentRole','company','organisation','location','phone','mobilePhone',
    'enrichmentStatus','enrichmentFound']);
  const fentries=Object.entries(n.f).filter(([k])=>!skip.has(k));
  const cells=fentries.map(([k,v])=>{
    const val=(k==='status')?`<span class="badge ${esc(v)}">${esc(v)}</span>`
      :(k==='ToEnhance'&&isPerson(n.t))?toEnhanceControl(id,v):fmtVal(k,v);
    return `<div class="field"><div class="k">${esc(labelFor(k))}</div><div class="v">${val}</div></div>`;
  });
  if(isPerson(n.t)){
    cells.push(`<div class="field"><div class="k">Enriched</div><div class="v">${enrichmentDisplay(n.f)}</div></div>`);
  }
  let fgrid='';
  if(cells.length){
    fgrid='<div class="section-label">Details</div><div class="grid">'+cells.join('')+'</div>';
  }

  // outbound relationships grouped by rel label
  const outByRel={};
  for(const [rel,tid] of n.l){(outByRel[rel]=outByRel[rel]||[]).push(tid);}
  let outHtml='';
  const relOrder=Object.keys(outByRel).sort();
  for(const rel of relOrder){outHtml+=relGroup(rel,outByRel[rel]);}

  // inbound grouped by source type
  const inbound=INBOUND[id]||[];
  const inByType={};
  for(const [rel,sid] of inbound){const st=NODES[sid]?NODES[sid].t:'?';(inByType[st]=inByType[st]||[]).push(sid);}
  let inHtml='';
  const inOrder=Object.keys(inByType).sort((a,b)=>inByType[b].length-inByType[a].length);
  for(const st of inOrder){
    const lbl=(TYPE_META[st]?TYPE_META[st].icon+' '+TYPE_META[st].label:st);
    inHtml+=relGroup(lbl,inByType[st]);
  }

  const aliases=(n.al&&n.al.length)?`<div class="rel-group"><div class="rel-head">Aliases</div><div class="tagrow">${n.al.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div></div>`:'';
  const tags=(n.tg&&n.tg.length)?`<div class="rel-group"><div class="rel-head">Tags</div><div class="tagrow">${n.tg.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div></div>`:'';

  detailEl.innerHTML=
    `<div class="card">
      <div class="card-head">
        <div class="avatar${isPerson(n.t)?' round':''}" style="background:${colorFor(n.n)}">${isPerson(n.t)?esc(initials(n.n)):icon(n.t)}</div>
        <div><div class="kicker">${esc(tm?tm.label:n.t)}</div><h2>${esc(n.n)}</h2></div>
      </div>
      ${contacts.length?`<div class="contact-chips">${contacts.join('')}</div>`:''}
      ${fgrid}
      ${enrichedProfileBlock(n)}
      ${outHtml?'<div class="section-label">Relationships</div>'+outHtml:''}
      ${inHtml?'<div class="section-label">Referenced by</div>'+inHtml:''}
      ${aliases}${tags}
    </div>`;

  detailEl.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>openEntity(c.dataset.go));
  detailEl.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{
    const box=el(b.dataset.more);const all=JSON.parse(box.dataset.all);
    box.innerHTML=all.map(linkChip).join('');
    box.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>openEntity(c.dataset.go));
    b.remove();
  });
  detailEl.parentElement.scrollTop=0;
  if(CAN_EDIT&&isPerson(n.t)){
    fetch('/to-enhance-state?id='+encodeURIComponent(id)).then(r=>r.json()).then(j=>{
      if(!j||j.status!=='ok')return;
      const cb=detailEl.querySelector('input[type=checkbox][data-teid]');
      if(cb&&cb.getAttribute('data-teid')===id){
        if(NODES[id]&&NODES[id].f)NODES[id].f.ToEnhance=j.value;
        cb.checked=j.value===true;
      }
    }).catch(()=>{});
  }
}

function highlightList(id){
  document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  const row=[...document.querySelectorAll('.item')].find(x=>x.dataset.id===id);
  if(row)row.scrollIntoView({block:'nearest'});
}

function openEntity(id,opts){
  opts=opts||{};
  const n=NODES[id];if(!n)return;
  const wasAsk=(mode==='ask');
  if(wasAsk)exitAsk();
  if(curId&&!opts.noHist){histBack.push({type:curType,id:curId});histFwd=[];}
  curId=id;
  if(wasAsk||curType!==n.t){curType=n.t;qEl.value='';renderSidebar();renderList();}
  highlightList(id);
  renderDetail(id);
  updateNav();
}

// ── Ask the Wiki (AI chat via local server) ──────────────────
function enterAsk(){
  mode='ask'; curId=null;
  document.querySelector('.list-col').style.display='none';
  detailEl.parentElement.classList.add('ask-mode');
  renderSidebar();
  renderChat();
}
function exitAsk(){
  if(mode!=='ask')return;
  mode='browse';
  document.querySelector('.list-col').style.display='';
  detailEl.parentElement.classList.remove('ask-mode');
  renderSidebar();
}
const SUGGESTIONS=['What have we done with Panasonic?','Who do we know at Visa?','Tell me about the Coca-Cola Company','Which people work at Lazada?'];
function renderChat(){
  detailEl.innerHTML=`<div class="ask-wrap">
    <div class="ask-top"><h2>💬 Ask me something</h2><p>AI answers grounded strictly in this vault's ${Object.keys(NODES).length.toLocaleString()} records. Every answer links back into the wiki.</p></div>
    <div class="chat" id="chat"></div>
    <div class="ask-input"><input id="askq" placeholder="Ask me something about a company, person or brand…" autocomplete="off"/><button id="asksend">Ask</button></div>
  </div>`;
  const chat=el('chat');
  if(!convo.length){
    chat.innerHTML=`<div class="suggests">${SUGGESTIONS.map(s=>`<span class="suggest" data-s="${esc(s)}">${esc(s)}</span>`).join('')}</div>`;
  }else{
    chat.innerHTML=convo.map(m=>m.role==='user'?`<div class="msg user">${esc(m.text)}</div>`:`<div class="msg bot">${m.html}</div>`).join('');
  }
  const input=el('askq'), send=el('asksend');
  send.onclick=()=>submitAsk(input.value);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')submitAsk(input.value);});
  detailEl.querySelectorAll('[data-s]').forEach(s=>s.onclick=()=>submitAsk(s.dataset.s));
  detailEl.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>openEntity(c.dataset.go));
  input.focus();
  chat.scrollTop=chat.scrollHeight;
}
async function submitAsk(text){
  text=(text||'').trim(); if(!text)return;
  convo.push({role:'user',text});
  convo.push({role:'bot',html:'<span class="ans-note">Thinking…</span>'});
  renderChat();
  try{
    const res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    convo.pop();
    convo.push({role:'bot',html:formatAnswer(data)});
  }catch(err){
    convo.pop();
    convo.push({role:'bot',html:`<span class="ans-note">The AI chat needs the local Ask server running. Launch <b>"Ask the Wiki.command"</b> in the influential-brands folder, then reload this page.<br><small>(${esc(err.message)})</small></span>`});
  }
  renderChat();
}
// Render the model's markdown answer as readable HTML. Input is HTML-escaped first,
// so the only tags introduced are our own — safe from injection.
function mdInline(s){
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}
function mdToHtml(text){
  const lines=String(text).split('\n'); let html=''; let i=0;
  const blank=l=>/^\s*$/.test(l), head=l=>/^\s*#{1,6}\s+/.test(l),
        ul=l=>/^\s*[-*]\s+/.test(l), ol=l=>/^\s*\d+\.\s+/.test(l);
  while(i<lines.length){
    const line=lines[i];
    if(blank(line)){i++;continue;}
    const hm=/^\s*(#{1,6})\s+(.*)$/.exec(line);
    if(hm){const lvl=Math.min(hm[1].length+3,6);html+=`<h${lvl}>${mdInline(hm[2].trim())}</h${lvl}>`;i++;continue;}
    if(ul(line)){html+='<ul>';while(i<lines.length&&ul(lines[i])){html+=`<li>${mdInline(lines[i].replace(/^\s*[-*]\s+/,''))}</li>`;i++;}html+='</ul>';continue;}
    if(ol(line)){html+='<ol>';while(i<lines.length&&ol(lines[i])){html+=`<li>${mdInline(lines[i].replace(/^\s*\d+\.\s+/,''))}</li>`;i++;}html+='</ol>';continue;}
    const para=[];
    while(i<lines.length&&!blank(lines[i])&&!head(lines[i])&&!ul(lines[i])&&!ol(lines[i])){para.push(lines[i]);i++;}
    html+=`<p>${mdInline(para.join('\n')).replace(/\n/g,'<br>')}</p>`;
  }
  return html||'<p>(no answer)</p>';
}
function formatAnswer(data){
  let h=mdToHtml(esc(data.answer||'(no answer)'));
  if(data.sources&&data.sources.length){
    const shown=data.sources.filter(s=>NODES[s.id]);
    const chips=shown.map(s=>linkChip(s.id)).join('');
    if(chips) h+=`<div class="ans-sec"><div class="ans-h">Sources (${shown.length})</div><div class="chips">${chips}</div></div>`;
  }
  return h;
}
function updateNav(){el('backBtn').disabled=!histBack.length;el('fwdBtn').disabled=!histFwd.length;}
el('backBtn').onclick=()=>{if(!histBack.length)return;histFwd.push({type:curType,id:curId});const s=histBack.pop();goto(s);};
el('fwdBtn').onclick=()=>{if(!histFwd.length)return;histBack.push({type:curType,id:curId});const s=histFwd.pop();goto(s);};
function goto(s){curId=s.id;if(curType!==s.type){curType=s.type;qEl.value='';renderSidebar();renderList();}highlightList(s.id);renderDetail(s.id);updateNav();}

qEl.addEventListener('input',()=>{renderList();});

// init
curType=TYPES[0].key;
renderSidebar();
renderList();
updateNav();
</script>
